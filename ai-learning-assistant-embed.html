<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI学习助手 - 学生入口</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #eef3ff 0%, #f8f5ff 55%, #eef7ff 100%);
    min-height: 100vh;
    color: #1f2937;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 880px; margin: 0 auto; padding: 28px 16px 44px; }

  /* 顶部主视觉 */
  .hero {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
    padding: 38px 34px 30px;
    color: #fff;
    background: linear-gradient(135deg, #3b6cff 0%, #6d5cf6 55%, #8f5cf7 100%);
    box-shadow: 0 14px 36px rgba(76, 94, 255, .28);
    margin-bottom: 22px;
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .hero::before { right: -70px; top: -90px; width: 240px; height: 240px; background: rgba(255,255,255,.12); }
  .hero::after  { right: 30px; bottom: -110px; width: 200px; height: 200px; background: rgba(255,255,255,.08); }
  .hero .badge {
    position: relative; z-index: 1;
    display: inline-block;
    font-size: 12px;
    letter-spacing: 3px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .hero h1 {
    position: relative; z-index: 1;
    margin: 0 0 12px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .hero p {
    position: relative; z-index: 1;
    margin: 0 0 20px;
    font-size: 15px;
    line-height: 1.85;
    color: rgba(255,255,255,.93);
    max-width: 580px;
  }
  .features {
    position: relative; z-index: 1;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .feature {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.32);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 13px;
    backdrop-filter: blur(4px);
  }
  .feature svg { width: 16px; height: 16px; flex: none; }

  /* 聊天区 */
  .chat-wrap {
    background: #fff;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(31, 41, 55, .08);
    border: 1px solid rgba(31, 41, 55, .06);
  }
  #sdk-container { width: 100%; height: 560px; border-radius: 14px; overflow: hidden; }

  /* 底部说明 */
  .footer-note {
    margin-top: 18px;
    text-align: center;
    font-size: 12.5px;
    color: #7d8597;
    line-height: 1.8;
  }
  .footer-note b { color: #5b6478; }

  /* 移动端适配 */
  @media (max-width: 600px) {
    .page { padding: 14px 12px 32px; }
    .hero { padding: 28px 20px 24px; border-radius: 16px; }
    .hero h1 { font-size: 24px; }
    .hero p { font-size: 14px; }
    .chat-wrap { padding: 12px; border-radius: 16px; }
    #sdk-container { height: 66vh; min-height: 420px; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 顶部主视觉 -->
  <div class="hero">
    <span class="badge">AI LEARNING ASSISTANT</span>
    <h1>AI学习助手</h1>
    <p>专注批判性 AI 素养培养的智能助手：支持老师双模式切换，生成探究材料，并按 APSE 维度诊断定位学习情况。</p>
    <div class="features">
      <span class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        老师双模式
      </span>
      <span class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        探究材料生成
      </span>
      <span class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/>
        </svg>
        APSE 维度诊断
      </span>
    </div>
  </div>

  <!-- 对话区 -->
  <div class="chat-wrap">
    <div id="sdk-container"></div>
  </div>

  <!-- 底部说明 -->
  <div class="footer-note">
    <b>使用说明：</b>本页面由扣子编程 Web SDK 驱动，学生打开即可对话，无需登录扣子账号。
  </div>
</div>

<!-- 扣子编程 Web SDK（CDN 引入） -->
<script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
<script>
cozeWebSDK.init({
  // 项目 ID：AI学习助手（已在扣子编程部署并开启 Web SDK 渠道）
  projectId: '7698258754638200841',
  // 挂载容器
  container: document.getElementById('sdk-container'),
  // 访问令牌：个人访问令牌（PAT）
  refreshToken: () => Promise.resolve('pat_obUTz4WOxzB9UThhOHrKqhYhL2qICyttTEAHMBKSDxYGzuqVT4nyZutWJkgYOR2r'),
  // 聊天窗口样式（边框交给外层容器）
  style: 'width: 100%; height: 100%; border: none;'
});
</script>
</body>
</html>
